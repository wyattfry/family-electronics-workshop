s" text-anchor="middle"><tspan x="313.2" dy="11">TP4056 + DW01</tspan><tspan x="313.2" dy="11">charger + protection</tspan></text><text x="156.6" y="-46.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="156.6" dy="10">100k</tspan></text><text x="140.4" y="-95.60000000000001" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="140.4" dy="11">VIN</tspan></text><text x="313.2" y="81.69999999999999" dominant-baseline="hanging" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="313.2" dy="11">1S LiPo</tspan><tspan x="313.2" dy="11">500–1000 mAh</tspan></text><text x="351.0" y="-203.6" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="351.0" dy="11">SS14 Schottky</tspan></text><text x="536.4" y="-115.5" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="536.4" dy="11">AO3401</tspan><tspan x="536.4" dy="11">P-MOSFET</tspan></text><circle cx="616.32" cy="-180" r="4.32" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="643.68" cy="-180" r="4.32" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="630.0" y="-210.79999999999998" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="630.0" dy="11">POWER</tspan></text><text x="466.2" y="51.19999999999999" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="466.2" dy="10">100k</tspan></text><text x="466.2" y="126.79999999999998" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="466.2" dy="10">100k</tspan></text><text x="131.4" y="180.52" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="131.4" dy="11">GND = OUT- / IN-</tspan></text><text x="165.6" y="206.8" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="165.6" dy="10">ON THE PAD: VIN (5 V) feeds SYS through the Schottky and turns the MOSFET off, so the charger sees only the cell.</tspan><tspan x="165.6" dy="10">OFF THE PAD: the 100k pulls the gate low, the MOSFET turns on, and the cell powers SYS.</tspan><tspan x="165.6" dy="10">Charge detect (not drawn): VIN through a 100k/100k divider to D9.</tspan></text><circle cx="144" cy="-72" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="144" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="558" cy="-180" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="558" cy="-72" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="144" cy="-136.8" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="666" cy="-180" r="2.7" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="672.3000000000001" y="-196.5" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="672.3000000000001" dy="11">SYS: XIAO 5V pin, DRV8833 VM,</tspan><tspan x="672.3000000000001" dy="11">steering servo, lights</tspan></text><circle cx="453.6" cy="-72" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="453.6" cy="93.6" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="489.6" cy="93.6" r="2.7" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="495.90000000000003" y="82.6" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="495.90000000000003" dy="11">D8: battery voltage (ADC)</tspan></text></svg>